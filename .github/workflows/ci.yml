name: CI

# ─────────────────────────────────────────────────────────────────────────────
# Triggers:
#   • Every push to main or any PR targeting main
#   • Can also be triggered manually from the Actions tab
# ─────────────────────────────────────────────────────────────────────────────
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

# Concurrency: cancel in-flight runs for the same PR/branch so we don't waste
# runner minutes when commits are pushed rapidly.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ───────────────────────────────────────────────────────────────────────────
  # 1 · Build & Test
  # ───────────────────────────────────────────────────────────────────────────
  build-and-test:
    name: Build & Test (Java 17)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build and run all tests
        run: mvn -B --no-transfer-progress clean verify

      - name: Upload test reports
        if: always()   # upload even when tests fail so reports are visible
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/target/surefire-reports/
            **/target/failsafe-reports/
          retention-days: 7

  # ───────────────────────────────────────────────────────────────────────────
  # 2 · OWASP Dependency Check
  #     Runs after tests so we don't spend time on CVE scanning if tests fail.
  #     Treat HIGH / CRITICAL findings as a build gate (CVSS threshold: 7).
  # ───────────────────────────────────────────────────────────────────────────
  owasp-check:
    name: OWASP Dependency Check
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      # Cache the NVD database so repeated runs don't re-download ~200 MB
      - name: Cache OWASP NVD data
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: owasp-nvd-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            owasp-nvd-${{ runner.os }}-

      - name: Run OWASP Dependency Check (CVSS fail threshold = 7)
        run: |
          mvn -B --no-transfer-progress \
            org.owasp:dependency-check-maven:check \
            -DfailBuildOnCVSS=7 \
            -DsuppressionFile=.github/owasp-suppressions.xml \
            -Dformats=HTML,JSON \
            || (echo "::error::HIGH or CRITICAL CVE found — see owasp-report artifact" && exit 1)
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}   # optional — increases NVD rate limit

      - name: Upload OWASP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owasp-report
          path: |
            **/target/dependency-check-report.html
            **/target/dependency-check-report.json
          retention-days: 14

  # ───────────────────────────────────────────────────────────────────────────
  # 3 · Docker Build Verification
  #     Confirms the multi-stage Dockerfile builds cleanly.
  #     Does NOT push — pushing is handled by the release workflow on main merge.
  # ───────────────────────────────────────────────────────────────────────────
  docker-build:
    name: Docker Build Verification
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          platforms: linux/amd64,linux/arm64
          tags: hexagonal-scim/app:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image (no push)
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          platforms: linux/amd64,linux/arm64
          tags: hexagonal-scim/frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

