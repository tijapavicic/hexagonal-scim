# Compose V2 — top-level 'version' key is obsolete and intentionally omitted.
# Requires Docker Compose v2.0+ (bundled with Docker Desktop 3.x+ and Docker Engine 20.10+).

services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  # Single instance shared by the application and Keycloak (separate databases).
  # The init script creates the keycloak database on the very first start.
  db:
    image: postgres:16-alpine
    container_name: hexagonal-scim-db
    environment:
      POSTGRES_DB:       hexagonal_scim
      POSTGRES_USER:     scim
      POSTGRES_PASSWORD: scim
    volumes:
      # Named volume — data survives container restarts and recreations.
      - postgres_data:/var/lib/postgresql/data
      # Init script: creates keycloak DB + user (runs only when data volume is empty).
      - ./docker/postgres/init-keycloak.sql:/docker-entrypoint-initdb.d/10-keycloak.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scim -d hexagonal_scim"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - hexagonal-net
    ports:
      - "5432:5432"   # Expose for local tooling (pgAdmin, psql, etc.)
    restart: unless-stopped

  # ── Keycloak ────────────────────────────────────────────────────────────────
  # Identity and access management — infrastructure for OAuth2 / OIDC.
  # Running in dev mode (start-dev) backed by the PostgreSQL instance above.
  #
  # Admin console : https://localhost:8443  (user: admin / admin)
  # Token endpoint:
  #   https://localhost:8443/realms/hexagonal-scim/protocol/openid-connect/token
  #
  # HTTPS: self-signed dev cert from docker/certs/ is mounted and configured.
  # HTTP on 8180 is kept active for internal use (Spring Boot JWK fetch, healthcheck).
  keycloak:
    image: quay.io/keycloak/keycloak:25.0.6
    container_name: hexagonal-scim-keycloak
    command: start-dev --import-realm
    environment:
      # ── Database ────────────────────────────────────────────────────────────
      KC_DB:          postgres
      KC_DB_URL:      jdbc:postgresql://db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak

      # ── Bootstrap admin ─────────────────────────────────────────────────────
      KEYCLOAK_ADMIN:          admin
      KEYCLOAK_ADMIN_PASSWORD: admin

      # ── HTTP (internal) ─────────────────────────────────────────────────────
      # Keep HTTP active on 8180 for Spring Boot JWK-set fetch and healthcheck.
      # HTTP is NOT exposed to the host — only HTTPS (8443) is.
      KC_HTTP_ENABLED: "true"
      KC_HTTP_PORT:    8180

      # ── HTTPS ───────────────────────────────────────────────────────────────
      # Certificate generated by: openssl req -x509 -nodes -days 3650 -newkey rsa:2048
      # Replace with a CA-signed cert for staging/production.
      KC_HTTPS_CERTIFICATE_FILE:     /opt/keycloak/certs/server.crt
      KC_HTTPS_CERTIFICATE_KEY_FILE: /opt/keycloak/certs/server.key
      KC_HTTPS_PORT: 8443

      # ── Observability ───────────────────────────────────────────────────────
      KC_HEALTH_ENABLED: "true"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./docker/keycloak/realm-export.json:/opt/keycloak/data/import/hexagonal-scim-realm.json:ro
      - ./docker/certs:/opt/keycloak/certs:ro
    healthcheck:
      # Keycloak 25 UBI9 has no curl/wget — use bash /dev/tcp on the internal HTTP port.
      # Probes the OIDC discovery endpoint: healthy only when the realm is fully imported.
      test:
        - CMD-SHELL
        - "bash -c 'exec 3<>/dev/tcp/localhost/8180 && printf \"GET /realms/hexagonal-scim/.well-known/openid-configuration HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n\" >&3 && head -1 <&3 | grep -q 200'"
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 90s
    networks:
      - hexagonal-net
    ports:
      - "8443:8443"   # HTTPS — browser access to Keycloak admin + token endpoint
    restart: unless-stopped

  # ── Application ─────────────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hexagonal-scim-app
    depends_on:
      db:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL:      jdbc:postgresql://db:5432/hexagonal_scim
      SPRING_DATASOURCE_USERNAME: scim
      SPRING_DATASOURCE_PASSWORD: scim
      # ── Keycloak / OAuth2 ──────────────────────────────────────────────────
      # Use the internal HTTP port so Spring does NOT need to trust the self-signed cert.
      # jwk-set-uri (not issuer-uri) skips issuer-equality check — required because the
      # browser sees https://localhost:8443 while the app reaches keycloak:8180 internally.
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8180/realms/hexagonal-scim/protocol/openid-connect/certs
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - hexagonal-net
    expose:
      - "8080"        # Internal only — Nginx proxies /api/* to http://app:8080 on hexagonal-net.
                      # Port 8080 is NOT bound to the host here (production-safe).
                      # To expose it locally use: docker compose -f docker-compose.yml -f docker-compose.override.yml up
                      # or just: docker compose up  (override.yml is auto-loaded by Docker Compose)
    restart: unless-stopped

  # ── Frontend ────────────────────────────────────────────────────────────────
  # React + Vite SPA served by Nginx with HTTPS.
  # Nginx terminates TLS, proxies /api/* to the Spring Boot backend (no CORS).
  # Keycloak is called directly by the browser at https://localhost:8443.
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_KEYCLOAK_URL: https://localhost:8443
        VITE_KEYCLOAK_REALM: hexagonal-scim
        VITE_KEYCLOAK_CLIENT_ID: hexagonal-scim-public
    container_name: hexagonal-scim-frontend
    depends_on:
      app:
        condition: service_healthy
    volumes:
      - ./docker/certs:/etc/nginx/certs:ro
    networks:
      - hexagonal-net
    ports:
      - "3000:443"    # HTTPS — browser access to React SPA
    restart: unless-stopped

# ── Volumes ────────────────────────────────────────────────────────────────────
volumes:
  postgres_data:
    driver: local

# ── Networks ───────────────────────────────────────────────────────────────────
networks:
  hexagonal-net:
    driver: bridge
