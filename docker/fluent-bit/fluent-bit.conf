# ──────────────────────────────────────────────────────────────────────────────
# Fluent Bit configuration — hexagonal-scim
#
# Pipeline:
#   [INPUT] tail /app/logs/*.log  (JSON files written by Spring Boot Logback)
#       ↓
#   [FILTER] add service/environment metadata
#       ↓
#   [OUTPUT] Splunk HEC  (http://splunk:8088 — TLS=On, Verify=Off for internal Docker net)
#   [OUTPUT] stdout       (mirror to Fluent Bit logs for debugging, remove in production)
#
# Volume:
#   The Docker named volume `app_logs` is mounted at /app/logs in BOTH:
#     - hexagonal-scim-app   (Spring Boot writes JSON log files here)
#     - hexagonal-scim-fluent-bit  (Fluent Bit tails the files here)
# ──────────────────────────────────────────────────────────────────────────────

[SERVICE]
    # Flush buffer to output every 1 second
    Flush           1
    # Run in foreground (container mode)
    Daemon          Off
    Log_Level       info
    Parsers_File    /fluent-bit/etc/parsers.conf
    # Built-in HTTP server — used for healthcheck
    HTTP_Server     On
    HTTP_Listen     0.0.0.0
    HTTP_Port       2020
    # Retry failed output delivery (Splunk starting slow)
    scheduler.cap   2000
    scheduler.base  5

# ──────────────────────────────────────────────────────────────────────────────
# INPUT — tail Spring Boot JSON log file from shared volume
# ──────────────────────────────────────────────────────────────────────────────
[INPUT]
    Name              tail
    # Mount the shared Docker volume app_logs at /app/logs
    Path              /app/logs/app.log
    # Also pick up rotated files from previous days (gzip-compressed)
    Path_Key          log_file
    Tag               hexagonal-scim.app
    Parser            json
    # Read from beginning so no events are missed on Fluent Bit restart
    Read_from_Head    True
    # Refresh file list every 5 seconds (catches log rotation)
    Refresh_Interval  5
    # Track file position in DB so restarts don't re-send old data
    DB                /var/lib/fluent-bit/app.db
    DB.Sync           Normal
    Skip_Long_Lines   On
    # Buffer pages (each 32KB) — tune if log volume is high
    Buffer_Chunk_Size 32k
    Buffer_Max_Size   128k

# ──────────────────────────────────────────────────────────────────────────────
# FILTER — enrich log records with service metadata
# ──────────────────────────────────────────────────────────────────────────────
[FILTER]
    Name   record_modifier
    Match  hexagonal-scim.*
    Record host         hexagonal-scim-app
    Record sourcetype   hexagonal-scim:json
    Record index        main

# ──────────────────────────────────────────────────────────────────────────────
# OUTPUT — Splunk HTTP Event Collector
# ──────────────────────────────────────────────────────────────────────────────
[OUTPUT]
    Name              splunk
    Match             hexagonal-scim.*
    Host              splunk
    Port              8088
    # Token must match SPLUNK_HEC_TOKEN in docker-compose
    Splunk_Token      11111111-1111-1111-1111-111111111111
    # Splunk Docker image uses self-signed cert — trust-but-don't-verify on internal net
    TLS               On
    TLS.Verify        Off
    # Human-readable source for Splunk search
    Splunk_Sourcetype hexagonal-scim:json
    # Retry on failure — Splunk may still be initializing
    Retry_Limit       10
    Workers           1

# ──────────────────────────────────────────────────────────────────────────────
# OUTPUT — stdout mirror (comment out in production to reduce verbosity)
# ──────────────────────────────────────────────────────────────────────────────
[OUTPUT]
    Name    stdout
    Match   hexagonal-scim.*
    Format  json_lines

