# ──────────────────────────────────────────────────────────────────────────────
# Fluent Bit custom parsers — hexagonal-scim
#
# The `json` parser handles the Logstash-encoded JSON output from Spring Boot.
# Each log line emitted by logstash-logback-encoder is a single JSON object.
# ──────────────────────────────────────────────────────────────────────────────

[PARSER]
    Name        json
    Format      json
    # ISO-8601 timestamp field emitted by LogstashEncoder
    Time_Key    @timestamp
    Time_Format %Y-%m-%dT%H:%M:%S.%LZ
    Time_Keep   On
    # Decode unicode escape sequences in message fields
    Decode_Field_As   escaped_utf8 log do_next
    Decode_Field_As   json         log

