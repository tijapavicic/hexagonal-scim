# ──────────────────────────────────────────────────────────────────────────────
# Prometheus scrape configuration — hexagonal-scim
#
# Scrapes:
#   • hexagonal-scim app   → /actuator/prometheus (Spring Boot Micrometer)
#   • prometheus itself    → self-monitoring
#
# All targets are on the hexagonal-net Docker bridge network.
# ──────────────────────────────────────────────────────────────────────────────

global:
  scrape_interval:     15s   # How frequently to scrape targets
  evaluation_interval: 15s   # How frequently to evaluate alerting rules
  scrape_timeout:      10s

  # External labels attached to every time series and alert — useful when
  # federation or remote_write ships data to a central Prometheus/Thanos/Mimir.
  external_labels:
    cluster: 'local'
    environment: 'docker'

# ──────────────────────────────────────────────────────────────────────────────
# Alerting rules (file-based, kept here for future use)
# ──────────────────────────────────────────────────────────────────────────────
# rule_files:
#   - /etc/prometheus/rules/*.yml

# ──────────────────────────────────────────────────────────────────────────────
# Scrape jobs
# ──────────────────────────────────────────────────────────────────────────────
scrape_configs:

  # ── Self ────────────────────────────────────────────────────────────────────
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # ── Spring Boot application ─────────────────────────────────────────────────
  # Exposes Micrometer metrics at /actuator/prometheus.
  # The `application` label matches the tag configured in application-docker.yml:
  #   management.metrics.tags.application = hexagonal-scim
  - job_name: 'hexagonal-scim'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 10s      # More frequent for demo — use 15-30s in production
    static_configs:
      - targets: ['app:8080']
        labels:
          application: 'hexagonal-scim'
          environment: 'docker'

  # ── Keycloak (optional — enable KC_METRICS_ENABLED=true in docker-compose) ───
  # - job_name: 'keycloak'
  #   metrics_path: '/metrics'
  #   static_configs:
  #     - targets: ['keycloak:8180']

