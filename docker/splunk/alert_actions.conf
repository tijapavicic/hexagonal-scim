# ──────────────────────────────────────────────────────────────────────────────
# alert_actions.conf — local dev override
#
# Mounted into the Splunk container at:
#   /opt/splunk/etc/system/local/alert_actions.conf
#
# Purpose:
#   Suppress the Splunk security warning:
#     "Found an empty value for 'allowedDomainList'"
#
#   In local development, email alerts are not used. Setting allowedDomainList
#   to a specific value (localhost) prevents Splunk from allowing alerts to any
#   arbitrary domain, satisfying the security check.
#
# Production note:
#   In a real environment, set this to your organisation's email domain(s),
#   e.g. allowedDomainList = yourcompany.com, yourdomain.org
# ──────────────────────────────────────────────────────────────────────────────

[email]
allowedDomainList = localhost

