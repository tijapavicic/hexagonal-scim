# Redirect all HTTP traffic to HTTPS
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

# HTTPS server
server {
    listen 443 ssl;
    server_name _;

    # ── TLS ─────────────────────────────────────────────────────────────────
    # Self-signed dev cert mounted from docker/certs/ via Docker volume.
    # Replace with a CA-signed cert (e.g. Let's Encrypt) for production.
    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    root  /usr/share/nginx/html;
    index index.html;

    # ── React Router — SPA fallback ─────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── API proxy ───────────────────────────────────────────────────────────
    # Forwards /api/* to the Spring Boot backend over HTTP (internal Docker network).
    # Same-origin from browser perspective — no CORS required.
    location /api/ {
        proxy_pass         http://app:8080/api/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }

    # ── Actuator proxy ──────────────────────────────────────────────────────
    location /actuator/ {
        proxy_pass       http://app:8080/actuator/;
        proxy_set_header Host $host;
    }

    # ── Security headers ────────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options        SAMEORIGIN                               always;
    add_header X-Content-Type-Options nosniff                                  always;
    add_header Referrer-Policy        strict-origin-when-cross-origin          always;
}
