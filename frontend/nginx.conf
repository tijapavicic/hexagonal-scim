server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # React Router — serve index.html for any client-side route
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse-proxy API calls to the Spring Boot backend (same origin → no CORS needed)
    location /api/ {
        proxy_pass         http://app:8080/api/;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Actuator health (optional — useful for frontend healthcheck)
    location /actuator/ {
        proxy_pass         http://app:8080/actuator/;
        proxy_set_header   Host $host;
    }

    # Security headers
    add_header X-Frame-Options        SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy        strict-origin-when-cross-origin;
}

