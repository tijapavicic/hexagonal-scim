spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://db:5432/hexagonal_scim}
    username: ${SPRING_DATASOURCE_USERNAME:scim}
    password: ${SPRING_DATASOURCE_PASSWORD:scim}
    driver-class-name: org.postgresql.Driver
  jpa:
    # database-platform: auto-detected by Hibernate 6.x — no explicit dialect needed
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true

api:
  legacy:
    deprecation-value: "true"
    sunset-date: "Wed, 31 Dec 2026 23:59:59 GMT"
    successor-link: '</api/v1/users>; rel="successor-version"'

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    tags:
      application: hexagonal-scim
      environment: docker
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 50ms,100ms,200ms,500ms,1s,2s

