spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/hexdb
    username: hexuser
    password: hexpassword
    driver-class-name: org.postgresql.Driver
  jpa:
    # database-platform: auto-detected by Hibernate 6.x — no explicit dialect needed
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    baseline-on-migrate: true
    baseline-version: 0.0.0

api:
  legacy:
    deprecation-value: "true"
    sunset-date: "Wed, 31 Dec 2026 23:59:59 GMT"
    successor-link: '</api/v1/users>; rel="successor-version"'

management:
  endpoints:
    web:
      exposure:
        include: health,info

