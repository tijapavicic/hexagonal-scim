spring:
  datasource:
    url: jdbc:h2:mem:hexdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

api:
  legacy:
    deprecation-value: "true"
    sunset-date: "Wed, 31 Dec 2026 23:59:59 GMT"
    successor-link: '</api/v1/users>; rel="successor-version"'
  pagination:
    default-page: 0
    default-size: 10
    default-pageable: true

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
  show-actuator: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
