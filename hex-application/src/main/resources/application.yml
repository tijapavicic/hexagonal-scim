spring:
  datasource:
    url: jdbc:h2:mem:hexdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

api:
  legacy:
    deprecation-value: "true"
    sunset-date: "Wed, 31 Dec 2026 23:59:59 GMT"
    successor-link: '</api/v1/users>; rel="successor-version"'
  pagination:
    default-page: 0
    default-size: 10
    default-pageable: true

payment:
  fx:
    eur-to-usd: 1.10

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
  show-actuator: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: hexagonal-scim
    distribution:
      # Enables Prometheus histogram buckets — required for percentile queries (p50/p95/p99)
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 50ms,100ms,200ms,500ms,1s,2s

logging:
  level:
    root: WARN
    com.example.user: INFO
    com.example.user.api: DEBUG
    org.springframework.security: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

